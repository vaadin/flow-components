ui.setcurrent=UI.setCurrent() must not be called directly. Use MockUIRule to properly set the current UI in tests.
string.javascript.call={0}(...) sends JavaScript as a string, which a strict Content Security Policy blocks. Declare it in a @JsDefinition interface and call it through executeJs(Class) or JsSnippets.of(Class).
string.eventdata.call={0}(...) adds event data that is not a declared DomEventData. The string overloads of addEventData and addEventDataElement are deprecated: use addEventDataPath(...) or addEventDataElementPath(...) for a property path, preventDefault() or stopPropagation() on the registration, or a DomEventData from a @JsDefinition interface, kept in a DomEventData variable or taken from JsSnippets.of(...).
string.filter.call={0}(...) sets an event filter as a string, which the browser compiles unless it is a property path. Declare the filter as a DomEventFilter in a @JsDefinition interface and set it with setFilterExpression(...).
