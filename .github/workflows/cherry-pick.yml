name: Cherry Pick

on:
  # Merges into main.
  push:
    branches:
      - main
  # Catches PRs merged into maintenance branches and target/* labels added
  # after the merge.
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

# Every run picks up everything that is pending, so queue runs instead of
# running them in parallel.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  cherry-pick:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # The action pushes with an explicit token; no credentials are kept
          # in .git/config so Claude cannot push.
          persist-credentials: false

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Cherry-pick
        uses: vaadin/github-actions/cherry-pick@main
        env:
          MAVEN_ARGS: -ntp -B
        with:
          github-token: ${{ secrets.CHERRY_PICK_TOKEN }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          verify-instructions: |
            - Run the unit tests of the affected component module(s), e.g. mvn test -pl <module>
            - Run the formatter: mvn spotless:apply
          extra-allowed-tools: Bash(mvn:*)
